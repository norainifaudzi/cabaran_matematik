/* =========================

========================= */

/* =========================
   GAME CONTAINER
========================= */

#gameContainer {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 45px;
  margin-top: 70px;
}


/* =========================
   PUZZLE BOARD
========================= */
#puzzleBoard {
  position: relative;

  width: 980px;
  height: 540px;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #f8fdff,
      #fffdf5
    );

  border: 6px solid #FFD700;
  border-radius: 25px;

  overflow: hidden;

  box-shadow:
    0 8px 0 #B8860B,
    0 0 25px rgba(255,255,255,0.8),
    0 0 40px rgba(255,215,0,0.35);
}


/* =========================
   SEMUA KEPING PUZZLE
========================= */

.puzzlePiece {
  position: absolute;
  display: none;
  height: auto;
  pointer-events: none;
  user-select: none;
  z-index: 10;

  animation: puzzlePop 0.6s ease-out;
}

@keyframes puzzlePop {
  0% {
    opacity: 0;
    transform: scale(0.7);
  }

  60% {
    opacity: 1;
    transform: scale(1.08);
  }

  100% {
    opacity: 1;
    transform: scale(1);
  }
}

<script>


/* =====================================
   TETAPAN PERMAINAN
===================================== */

let current = 0;

let questions = [];

// Jumlah maksimum soalan yang boleh diberikan
const totalQuestions = 20;

// Jumlah kepingan puzzle yang perlu dilengkapkan
const puzzlePieces = 15;

// Jumlah jawapan betul
let correctCount = 0;

// Jumlah soalan yang telah dijawab
let attempts = 0;

// Sasaran untuk berjaya
const targetCorrect = 15;


/* =====================================
   GENERATE SOALAN
===================================== */

for (let i = 0; i < totalQuestions; i++) {


  let a =
    Math.floor(Math.random() * 20) + 10;


  let b =
    Math.floor(Math.random() * 9) + 1;


  let ans = a - b;


  let choices = [ans];


  while (choices.length < 3) {


    let wrong =
      ans +
      Math.floor(Math.random() * 5) - 2;


    if (
      wrong > 0 &&
      !choices.includes(wrong)
    ) {

      choices.push(wrong);

    }

  }


  choices.sort(
    () => Math.random() - 0.5
  );


  questions.push({

    q: `${a} - ${b} = ?`,

    ans: ans,

    choices: choices

  });

}


function showQuestion() {

  if (current >= totalQuestions) {
    return;
  }

  let q = questions[current];

  document
    .getElementById("questionText")
    .textContent = q.q;

  let choicesDiv =
    document.getElementById("choices");

  choicesDiv.innerHTML = "";

  q.choices.forEach(choice => {

    let btn =
      document.createElement("button");

    btn.textContent = choice;
    btn.className = "choiceBtn";

    btn.onclick =
      () => checkAnswer(btn, choice);

    choicesDiv.appendChild(btn);

  });

}


/* =====================================
   PAPAR MESSAGE
===================================== */

function showBox(
  title,
  text,
  link = null,
  btnText = "NEXT"
) {


  document
    .getElementById("msgTitle")
    .innerHTML = title;


  document
    .getElementById("msgText")
    .innerHTML = text;


  document
    .getElementById("messageBox")
    .style.display = "block";


  let nextBtn =
    document.getElementById("nextBtn");


  nextBtn.innerText =
    btnText;


  if (link) {


    nextBtn.style.display =
      "inline-block";


    nextBtn.onclick = () => {

      window.location.href =
        link;

    };


  } else {


    nextBtn.style.display =
      "none";

  }

}


/* =====================================
   UPDATE PROGRESS
===================================== */

function updateProgress() {

  document.getElementById("pieceCount").textContent = correctCount;

}


/* =====================================
   SEMAK JAWAPAN
===================================== */

function checkAnswer(btn, choice) {

  // Elakkan klik berulang
  let allButtons = document.querySelectorAll(".choiceBtn");

  allButtons.forEach(b => {
    b.disabled = true;
  });

  attempts++;

  // ===============================
  // JAWAPAN BETUL
  // ===============================

  if (choice === questions[current].ans) {

    btn.classList.add("correct");

    if (correctCount < puzzlePieces) {

      correctCount++;

      let piece = document.getElementById(
        "piece" + correctCount
      );

      piece.style.display = "block";
      piece.style.zIndex = 10 + correctCount;
    }

    updateProgress();

    current++;

    // PUZZLE SIAP
    if (correctCount >= puzzlePieces) {

      if (!localStorage.getItem("tolakKeyGiven")) {

        localStorage.setItem(
          "tolakKeyGiven",
          "true"
        );

        localStorage.setItem(
          "misiDarabAktif",
          "true"
        );

        let keys = parseInt(
          localStorage.getItem("keys") || "0",
          10
        );

        localStorage.setItem(
          "keys",
          keys + 1
        );
      }

      showBox(
        "Tahniah! 🎉",
        "Semua 15 keping jigsaw telah berjaya disusun! 🧩<br><br>" +
        "MISI BERJAYA!!!!",
        "../tahap1.html",
        "NEXT"
      );

      return;
    }

    setTimeout(showQuestion, 700);

  }

  // ===============================
  // JAWAPAN SALAH
  // ===============================

  else {

    btn.classList.add("wrong");
    btn.textContent = "Jawapan anda ❌";

    document
      .getElementById("buzzSound")
      .play()
      .catch(() => {});

    current++;

    updateProgress();

    if (current >= totalQuestions) {

  showBox(
    "😢 MISI GAGAL",
    "Anda mendapat " + correctCount + " daripada 15 jawapan betul. 🧩<br><br>" +
    "Jangan berputus asa! Cuba lagi dan tingkatkan skor anda! 💪🌟",
    "tolak1.html",
    "CUBA LAGI"
);

      return;
    }

    setTimeout(showQuestion, 700);
  }
}


/* =====================================
   MULA PERMAINAN
===================================== */

updateProgress();
/* Mula soalan */
       
/* ===================================== 
   BUTANG MULA MISI 
===================================== */ 
 
document 
    .getElementById("startMissionBtn") 
    .addEventListener("click", function(){ 
 
        /* Tutup kotak arahan */ 
        document 
            .getElementById("startBox") 
            .style.display = "none"; 
 
        /* 🚀 MULA TIMER */ 
        if (window.mulaMisi) {
            window.mulaMisi();
        }
 
        /* Mula soalan */ 
        showQuestion(); 
         
});

</script>
