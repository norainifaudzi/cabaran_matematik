/* ===========================
   🐦 BURUNG TERBANG SETEMPAT
=========================== */

#bird1,
#bird2,
#bird3{

position:absolute;

display:none;

}


/* Burung 1 */

#bird1{

top:90px;

left:350px;

width:100px;

animation:floatBird 3s ease-in-out infinite;

}


/* Burung 2 */

#bird2{

top:100px;

left:500px;

width:80px;

animation:floatBird 4s ease-in-out infinite;

animation-delay:1s;

}


/* Burung 3 */

#bird3{

top:90px;

left:1100px;

width:100px;

animation:floatBird 3.5s ease-in-out infinite;

animation-delay:2s;

}


/* Gerakan terbang setempat */

@keyframes floatBird{

0%{

transform:translateY(0) rotate(-5deg);

}


50%{

transform:translateY(-25px) rotate(5deg);

}


100%{

transform:translateY(0) rotate(-5deg);

}

}

/* ===========================
   🐟 IKAN BERENANG
=========================== */

#ikan1,
#ikan2,
#ikan3,
#ikan4{

position:absolute;

display:none;

}


/* Ikan 1 */

#ikan1{

bottom:25px;

right:100px;

width:110px;

animation:swim1 12s ease-in-out infinite;

}


/* Ikan 2 */

#ikan2{

bottom:50px;

left:80px;

width:110px;

animation:swim2 15s ease-in-out infinite;

}


/* Ikan 3 */

#ikan3{

bottom:50px;

left:80px;

width:100px;

animation:swim3 10s ease-in-out infinite;

}

/* Ikan 4 */

#ikan4{

bottom:30px;

left:90px;

width:100px;

animation:swim4 10s ease-in-out infinite;

}

/* ===========================
      🐟 IKAN 1
=========================== */

@keyframes swim1{

0%{
transform:translate(0,0) rotate(0deg);
}

20%{
transform:translate(40px,-6px) rotate(-3deg);
}

40%{
transform:translate(90px,4px) rotate(2deg);
}

60%{
transform:translate(140px,-5px) rotate(-2deg);
}

80%{
transform:translate(80px,3px) rotate(2deg);
}

100%{
transform:translate(0,0) rotate(0deg);
}

}


/* ===========================
      🐟 IKAN 2
=========================== */

@keyframes swim2{

0%{
transform:scaleX(-1) translate(0,0);
}

25%{
transform:scaleX(-1) translate(60px,8px);
}

50%{
transform:scaleX(-1) translate(140px,-6px);
}

75%{
transform:scaleX(-1) translate(60px,5px);
}

100%{
transform:scaleX(-1) translate(0,0);
}

}


/* ===========================
      🐟 IKAN 3
=========================== */

@keyframes swim3{

0%{
transform:translate(0,0) rotate(-2deg);
}

15%{
transform:translate(-25px,-5px) rotate(2deg);
}

35%{
transform:translate(-60px,6px) rotate(-2deg);
}

55%{
transform:translate(-100px,-8px) rotate(3deg);
}

75%{
transform:translate(-60px,4px) rotate(-2deg);
}

100%{
transform:translate(0,0) rotate(-2deg);
}

}


/* ===========================
      🐟 IKAN 4
=========================== */

@keyframes swim4{

0%{
transform:translate(0,0) scale(.95);
}

20%{
transform:translate(35px,-4px) scale(1);
}

40%{
transform:translate(70px,6px) scale(.95);
}

60%{
transform:translate(110px,-6px) scale(1);
}

80%{
transform:translate(60px,3px) scale(.95);
}

100%{
transform:translate(0,0) scale(.95);
}

}

/* ===========================
        🫧 BUBBLE IKAN
=========================== */


.bubble{

position:absolute;

bottom:80px;

width:12px;

height:12px;

border-radius:50%;

background:rgba(255,255,255,.7);

display:none;

pointer-events:none;

animation:bubbleUp 6s linear infinite;

}


/* kedudukan bubble */

#bubble1{

left:20%;

animation-delay:0s;

}


#bubble2{

left:35%;

width:8px;

height:8px;

animation-delay:1.5s;

}


#bubble3{

left:50%;

animation-delay:3s;

}


#bubble4{

left:70%;

width:10px;

height:10px;

animation-delay:4s;

}


#bubble5{

left:85%;

animation-delay:2s;

}



/* bubble naik */

@keyframes bubbleUp{


0%{

transform:
translateY(0)
scale(.5);

opacity:0;

}


20%{

opacity:1;

}


100%{

transform:
translateY(-250px)
translateX(20px)
scale(1.2);

opacity:0;

}


}

/* ===========================
        🛶 SAMPAN
=========================== */

#part8{

position:absolute;

bottom:-20px;

right:10%;

width:180px;

display:none;

transform-origin:center center;

animation:boatFloat 5s ease-in-out infinite;

}
/* Sampan bergoyang */

@keyframes boatFloat{

0%{

transform:
translateY(0px)
rotate(-2deg);

}

20%{

transform:
translateY(-3px)
rotate(1deg);

}

40%{

transform:
translateY(-7px)
rotate(3deg);

}

60%{

transform:
translateY(-4px)
rotate(1deg);

}

80%{

transform:
translateY(-2px)
rotate(-1deg);

}

100%{

transform:
translateY(0px)
rotate(-2deg);

}

}

#awan1.move{

}

#awan2.move{
animation:awan2Gerak 30s linear infinite;
}

@keyframes awan1Gerak{
0%{
transform:translateX(0);
}
100%{

}
}

@keyframes awan2Gerak{
0%{

/* =========================
   🌟 KOTAK SOALAN CERIA
========================= */

#questionBox{

    position:absolute;

    top:50%;
    left:30px;

    transform:translateY(-50%);

    width:380px;

    padding:18px 18px 16px;

    background:linear-gradient(
        180deg,
        #FFFDF5 0%,
        #FFF4C7 100%
    );

    border:4px solid #F4C542;

    border-radius:25px;

    box-shadow:
        0 8px 0 #D89B25,
        0 12px 20px rgba(0,0,0,.25),
        inset 0 2px 0 rgba(255,255,255,.9);

    text-align:center;

    z-index:100;
}


/* =========================
   🧮 TAJUK / SOALAN
========================= */

#question{

    margin:0 0 20px;

    padding:15px 18px;

    background:white;

    border-radius:20px;

    border:3px solid #FFD166;

    color:#4E342E;

    font-size:25px;

    font-weight:bold;

    line-height:1.35;

    box-shadow:
        0 5px 10px rgba(0,0,0,.15),
        inset 0 2px 3px rgba(255,255,255,.9);

}


/* =========================
   🎯 PILIHAN JAWAPAN
========================= */

#answers button{

    display:block;

    width:90%;

    margin:12px auto;

    padding:13px 16px;

    font-size:20px;

    font-weight:bold;

    font-family:'Comic Sans MS', Arial;

    color:#4E342E;

    background:#FFFFFF;

    border:3px solid #90CAF9;

    border-radius:18px;

    cursor:pointer;

    box-shadow:
        0 5px 0 #64B5F6,
        0 7px 12px rgba(0,0,0,.15);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;

}

/* =========================
   ❌ MESEJ JAWAPAN SALAH
========================= */

#wrongMessage{
    display:none;
    margin:10px auto 5px;
    padding:8px 12px;

    background:#FFE5E5;
    border:3px solid #FF6B6B;
    border-radius:15px;

    color:#C62828;
    font-size:19px;
    font-weight:bold;

    text-align:center;

    animation:wrongPop .3s ease;
}

@keyframes wrongPop{

    from{
        transform:scale(.8);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

/* Hover */

#answers button:hover{

    transform:translateY(-3px) scale(1.03);

    background:#E3F2FD;

    box-shadow:
        0 7px 0 #42A5F5,
        0 10px 15px rgba(0,0,0,.18);

}


/* Bila ditekan */

#answers button:active{

    transform:translateY(3px);

    box-shadow:
        0 2px 0 #64B5F6;

}



/* =====================================================
   💬 MESSAGE BOX - SEBELAH KIRI
===================================================== */

#message{
    position:absolute;

    top:36%;
    left:23%;

    transform:translate(-50%,-50%);

    width:560px;
    max-width:42vw;

    padding:30px 35px;

/* ===============================
   ✨ ANIMASI MESSAGE BOX
================================ */

@keyframes messagePop{

    0%{
        transform:translate(-50%,-50%) scale(.5);
        opacity:0;
    }

    70%{
        transform:translate(-50%,-50%) scale(1.08);
        opacity:1;
    }

    100%{
        transform:translate(-50%,-50%) scale(1);
        opacity:1;
    }

}


/* =====================================================
   🎉 MESSAGE BERJAYA
===================================================== */

.missionSuccess{

    width:100%;

    padding:10px;

    text-align:center;

    font-family:'Comic Sans MS',Arial,sans-serif;

}


/* Tajuk */

.missionSuccess .bigText{

    font-size:38px;

    font-weight:bold;

    color:#00A651;

    margin:5px 0 15px;

    line-height:1.2;

    text-shadow:
        2px 2px 0 #B7E4C7,
        3px 3px 4px rgba(0,0,0,.25);

}


/* Mesej */

.missionSuccess .messageText{

    font-size:21px;

    font-weight:bold;

    color:#5D4037;

    margin:10px 0;

    line-height:1.4;

}


/* Kotak skor */

.missionSuccess .scoreBox{

    width:90%;

    padding:12px;

    margin:15px auto;

    background:linear-gradient(
        180deg,
        #FFFFFF,
        #FFF8DC
    );

    border:4px solid #F4C542;

    border-radius:20px;

    font-size:22px;

    font-weight:bold;

    line-height:1.4;

    box-shadow:

}


/* =====================================================

===================================================== */

.missionFail{

}

.missionFail .bigText{
    font-size:32px;

}

}

}

    width:90%;

    padding:12px;

    margin:15px auto;

    border-radius:20px;

    font-size:22px;

    color:#C62828;

    box-shadow:

}

================================ */

function mulaMisiPecahan(){

    console.log("🚀 MULA MISI PECAHAN");

    // Sembunyikan kotak arahan
    const instructionBox =
        document.getElementById("instructionBox");

    if(instructionBox){

        instructionBox.style.display = "none";

    }


    // Paparkan kotak soalan
    const questionBox =
        document.getElementById("questionBox");

    if(questionBox){

        questionBox.style.display = "block";

    }


    // Mula timer daripada timer.js
    if(
        window.mathAdventureTimer &&
        typeof window.mathAdventureTimer.startTimer === "function"
    ){

        window.mathAdventureTimer.startTimer();

        console.log("⏱️ TIMER PECAHAN BERMULA");

    }
    else{

        console.error(
            "❌ Fungsi startTimer daripada timer.js tidak ditemui."
        );

    }


    // Pastikan permainan bermula dari soalan pertama
    gameEnded = false;

    current = 0;

    loadQuestion();

}

// =====================
// ACAK SOALAN
// =====================

function shuffle(array){

for(let i=array.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];

}

}


shuffle(questions);



// =====================
// PAPAR SOALAN
// =====================

function loadQuestion(){


let q=questions[current];


document.getElementById("question").innerHTML=q.q;

// Sembunyikan mesej SALAH
    document.getElementById("wrongMessage").style.display = "none";

let html="";


q.a.forEach(function(x){


html+=`

<button onclick="checkAnswer('${x}')">

${x}

</button>

`;


});


document.getElementById("answers").innerHTML=html;


}

// =====================
// SEMAK JAWAPAN
// =====================

function checkAnswer(ans){

    // 🛑 Jika permainan sudah tamat
    if(gameEnded) return;

    let q = questions[current];

    digunakan++;

    // =====================================================
    // 🔒 KUNCI SEMUA BUTANG JAWAPAN SELEPAS SATU KLIK
    // =====================================================

    document.querySelectorAll("#answers button").forEach(function(btn){
        btn.disabled = true;
    });


    // =====================================================
    // ❌ SALAH
    // =====================================================

    if(ans != q.c){

        salah++;

        const wrongMessage =
            document.getElementById("wrongMessage");

        wrongMessage.style.display = "block";

    }


    // =====================================================
    // ✅ BETUL
    // =====================================================

    else{

        score++;
        betul++;
        crystal++;

        // KEMASKINI SKOR
        document.getElementById("score").innerHTML = score;


        // =================================================
        // 🏝️ BINA PULAU
        // =================================================

        if(betul <= 15){

            objekPulau[betul-1].forEach(function(obj){

                let item =
                    document.getElementById(obj);

                if(item){

                    item.style.display = "block";

                    mainkanBunyi(obj);


                    // ================================
                    // 🌈 APABILA PELANGI MUNCUL
                    // ================================

                    if(obj == "part15"){

                        document.getElementById("part15")
                            .classList.add("show");

                        document.getElementById("awan1")
                            .style.display = "block";

                        document.getElementById("awan2")
                            .style.display = "block";

                        document.getElementById("awan1")
                            .classList.add("move");

                        document.getElementById("awan2")
                            .classList.add("move");


                        // PLAYER GEMBIRA
                        let player =
                            document.getElementById("playerImg");

                        if(player){

                            player.src =
                                "../images/lelakigembira.gif?" +
                                Date.now();

                        }

                    }

                }

            });

        }


        // =================================================
        // 💬 CERITA
        // =================================================

        if(typeof cerita !== "undefined" && cerita[betul-1]){

            document.getElementById("message").innerHTML =
                cerita[betul-1];

        }

    }


    // =====================================================
    // 🎉 BERJAYA — 15 BETUL
    // =====================================================

    if(betul >= 15){

        gameEnded = true;


        // HENTIKAN TIMER
        hentikanTimerPecahan();


        // =========================================
        // 🔑 BERI KUNCI SEKALI SAHAJA
        // =========================================

        if(
            localStorage.getItem("kunciPecahanDiberi")
            !== "true"
        ){

            let jumlahKunci =
                parseInt(
                    localStorage.getItem("keys") || "0"
                );

            jumlahKunci++;

            localStorage.setItem(
                "keys",
                jumlahKunci
            );

            localStorage.setItem(
                "kunciPecahanDiberi",
                "true"
            );

        }


        // AKTIFKAN MISI MASA
        localStorage.setItem(
            "misiMasaAktif",
            "true"
        );


        // SEMBUNYIKAN SOALAN
        document.getElementById(
            "questionBox"
        ).style.display = "none";


        // MESSAGE BERJAYA
        const messageBox =
            document.getElementById("message");


        messageBox.innerHTML = `

            <div class="missionSuccess">

                <div class="bigText">
                    🎉 TAHNIAH! 🎉
                </div>

                <div class="messageText">
                    Hebat! Anda berjaya mendapat
                    <strong>15/15</strong> jawapan betul! 🥳
                </div>

                <div class="messageText">
                    🏆 <strong>MISI BERJAYA!</strong>
                </div>

                <div class="messageText">
                    🌈 Pulau Pecahan anda telah lengkap!
                </div>

                <div class="messageText">
                    Bersedia untuk misi seterusnya?
                </div>

                <button
                    onclick="nextMission()"
                    class="gameBtn successBtn">

                    🚢 MISI SETERUSNYA

                </button>

            </div>

        `;


        messageBox.style.display = "block";

        return;
    }


    // =====================================================
    // 😢 GAGAL — SELEPAS 20 SOALAN
    // =====================================================

    if(
        digunakan >= 20 &&
        betul < 15
    ){

        gameEnded = true;


        // SEMBUNYIKAN SOALAN
        document.getElementById(
            "questionBox"
        ).style.display = "none";


        // MESSAGE GAGAL
        const messageBox =
            document.getElementById("message");


        messageBox.innerHTML = `

            <div class="missionFail">

                <div class="bigText">
                    😢 MISI GAGAL!
                </div>

                <div class="messageText">
                    Anda mendapat
                    <strong>${betul}/15</strong>
                    jawapan betul.
                </div>

                <div class="messageText">
                    ❌ <strong>MISI BELUM BERJAYA</strong>
                </div>

                <div class="messageText">
                    Jangan putus asa!<br>
                    Cuba lagi dan bina semula pulau anda. 💪🌴
                </div>

                <button
                    onclick="ulangMisi()"
                    class="gameBtn retryBtn">

                    🔄 ULANG MISI

                </button>

            </div>

        `;


        messageBox.style.display = "block";

        return;
    }


    // =====================================================
    // ➡️ PERGI KE SOALAN SETERUSNYA
    // =====================================================

    current++;


    // Pastikan tidak melebihi array
    if(current >= questions.length){

        current = 0;

    }


    // Paparkan soalan baharu
    setTimeout(function(){

        document.getElementById(
            "message"
        ).innerHTML = "";

        loadQuestion();

    },500);

}

// =====================
// BUTTON MISI SETERUSNYA
// =====================

function nextMission(){

    window.location.href = "../tahap1.html";

}


// =====================
// BUTTON ULANG SEMULA
// =====================

function ulangMisi(){

    location.reload();

}

// ===== Bunyi =====
window.onload = function () { 

    const sea =
        document.getElementById("seaSound"); 

    const bird =
        document.getElementById("birdSound"); 

    const ayam =
        document.getElementById("chickenSound"); 

    const biri =
        document.getElementById("sheepSound"); 

    const lembu =
        document.getElementById("cowSound"); 


    if(sea) sea.volume = 0.20; 
    if(bird) bird.volume = 0.20; 
    if(ayam) ayam.volume = 0.20; 
    if(biri) biri.volume = 0.20; 
    if(lembu) lembu.volume = 0.20; 


    // Sembunyikan soalan dahulu
    document.getElementById(
        "questionBox"
    ).style.display = "none";


    // Pastikan kotak arahan muncul
    document.getElementById(
        "instructionBox"
    ).style.display = "block";


    gameEnded = false;

    current = 0;

};

// ===========================
// Fungsi Bunyi Objek
// ===========================

function mainkanBunyi(id){

    let bunyi = null;


    if(id=="part1"){
        bunyi=document.getElementById("seaSound");
    }


    if(id=="bird1" || id=="bird2" || id=="bird3"){
        bunyi=document.getElementById("birdSound");
    }


    if(id=="part12"){
        bunyi=document.getElementById("chickenSound");
    }


    if(id=="biri1" || id=="biri2"){
        bunyi=document.getElementById("sheepSound");
    }


    if(id=="part14"){
        bunyi=document.getElementById("cowSound");
    }


    if(bunyi){

        bunyi.currentTime=0;
        bunyi.play();

    }

}

// ===========================
/* =========================================
   HENTIKAN TIMER APABILA MISI PECAHAN BERJAYA
========================================= */

function hentikanTimerPecahan(){

    // Cuba panggil fungsi timer yang biasa digunakan
    if(typeof stopTimer === "function"){
        stopTimer();
    }

    if(typeof stopGameTimer === "function"){
        stopGameTimer();
    }

    if(typeof hentikanTimer === "function"){
        hentikanTimer();
    }

    if(typeof stopMissionTimer === "function"){
        stopMissionTimer();
    }

    // Event khas untuk timer.js
    document.dispatchEvent(
        new CustomEvent("missionCompleted")
    );
}
