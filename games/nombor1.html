===================================================== */

}

/* =====================================================
   ANIMASI BARANG
===================================================== */

.item{
    position:absolute;

    cursor:pointer;

    transition:
        left 1s ease,
        top 1s ease,
        bottom 1s ease,
        right 1s ease;

    z-index:20;

    user-select:none;
}


/* =====================================================
   ANIMASI IMEJ
===================================================== */

.item img{
    display:block;

    transition:
        transform .25s ease,
        filter .25s ease,
        opacity .25s ease;
}


/* =====================================================
   BLINK + GLOW
===================================================== */

.item.blinkNow img{
    animation:itemBlink .8s ease-in-out infinite;
}

@keyframes itemBlink{

    0%{
        transform:scale(1);

        filter:
            drop-shadow(0 0 0px rgba(255,255,255,0));

        opacity:1;
    }

    50%{
        transform:
            scale(1.12)
            rotate(-3deg);

        filter:
            drop-shadow(0 0 8px #fff)
            drop-shadow(0 0 18px #ffd54f)
            drop-shadow(0 0 28px #ff9800);

        opacity:.75;
    }

    100%{
        transform:scale(1);

        filter:
            drop-shadow(0 0 0px rgba(255,255,255,0));

        opacity:1;
    }
}


/* =====================================================
   BARANG SUDAH DIKEMAS
===================================================== */

.item.kemas img{
    animation:none !important;
    filter:none !important;
}


/* =====================================================
   BAKUL SAMPAH SUDAH SELESAI
===================================================== */

.item.selesai img{
    animation:none !important;
    filter:none !important;
}


/* =====================================================
   BARANG SAMPAI
===================================================== */

.item.kemas{
    cursor:default;

    animation:
        kemasItem .8s ease;
}

@keyframes kemasItem{

    0%{
        transform:
            scale(1);
    }

    40%{
        transform:
            scale(1.15)
            rotate(-5deg);
    }

    70%{
        transform:
            scale(1.05)
            rotate(3deg);
    }

    100%{
        transform:
            scale(1)
            rotate(0);
    }
}

   KOTAK SOALAN
===================================================== */

===================================================== */

#topi.kemas{

}

@keyframes topiMasukAlmari{

    0%{

        transform:
            scale(1)
            rotate(0deg);

        opacity:1;
    }

    50%{

        transform:
            scale(.85)
            rotate(-5deg);

        opacity:1;

    80%{

   SHIRT → MASUK KE DALAM ALMARI
===================================================== */

#shirt.kemas{

    left:62%;

    z-index:5;

    animation:
        shirtMasukAlmari
        1.5s ease-in forwards;
}

@keyframes shirtMasukAlmari{

        transform:
            scale(1)
            rotate(0deg);

        opacity:1;
    }

    50%{

        transform:
            scale(.85)
            rotate(-5deg);

    80%{

    100%{

            rotate(0deg);

        opacity:0;
    }
}


/* =====================================================
   BANTAL → BAKUL SAMPAH
===================================================== */

#bantal.buangSampah{

    z-index:100;

    pointer-events:none;

    animation:
        bantalMasukBakul
        1.5s ease-in forwards;
}

@keyframes bantalMasukBakul{

    0%{

        transform:
            translate(0,0)
            scale(1)
            rotate(0deg);

        opacity:1;
    }

    30%{

        transform:
            translate(
                calc(var(--moveX) * .3),
                calc(var(--moveY) * .3 - 120px)
            )
            scale(1)
            rotate(-8deg);

        opacity:1;
    }

    60%{

        transform:
            translate(
                calc(var(--moveX) * .7),
                calc(var(--moveY) * .7 - 100px)
            )
            scale(1)
            rotate(8deg);

        opacity:1;
    }

    80%{

        transform:
            translate(
                var(--moveX),
                calc(var(--moveY) - 70px)
            )
            scale(1)
            rotate(-3deg);

        opacity:1;
    }

    100%{

        transform:
            translate(
                var(--moveX),
                var(--moveY)
            )
            scale(1)
            rotate(0deg);

        opacity:0;
    }
}


/* =====================================================
   YOYO → TERBANG KE KOTAK
===================================================== */

#yoyo.terbang{

    z-index:100;

    pointer-events:none;

    animation:
        yoyoTerbang
        1.5s ease-in forwards;
}

@keyframes yoyoTerbang{

    0%{

        left:40%;
        top:50%;

        transform:
            rotate(0deg)
            scale(1);

        opacity:1;
    }

    30%{

        left:50%;
        top:40%;

        transform:
            rotate(180deg)
            scale(1);

        opacity:1;
    }

    60%{

        left:65%;
        top:35%;

        transform:
            rotate(360deg)
            scale(.9);

        opacity:1;
    }

    85%{

        left:75%;
        bottom:25%;
        top:auto;

        transform:
            rotate(540deg)
            scale(.6);

        opacity:1;
    }

    100%{

        left:75%;
        bottom:25%;
        top:auto;

        transform:
            rotate(720deg)
            scale(.1);

        opacity:0;
    }
}

/* =====================================================
   PILIH 20 SOALAN RAWAK
===================================================== */

const selected =
    [...allQuestions]
    .sort(() => Math.random() - 0.5)
    .slice(0,20);


/* =====================================================
   PEMBOLEH UBAH
===================================================== */

let currentQuestion = 0;

let score = 0;

let wrong = 0;

let cleaned = 0;

let activeItem = null;


/* =====================================================
   SENARAI BARANG
===================================================== */

const items = [

    document.getElementById("keretapi"),

    document.getElementById("dekak"),

    document.getElementById("diari"),

    document.getElementById("bola"),

    document.getElementById("tisu"),

    document.getElementById("bakulsampah"),

    document.getElementById("bantal"),

    document.getElementById("bear"),

    document.getElementById("beg"),

    document.getElementById("calendar"),

    document.getElementById("shirt"),

    document.getElementById("topi"),

    document.getElementById("warna"),

    document.getElementById("yoyo"),

    document.getElementById("kertas")

];


/* =====================================================
   BLINK SATU PERSATU
===================================================== */

let blinkIndex = 0;


/* =====================================================
   AKTIFKAN BLINK
===================================================== */

function startBlink(){

    items.forEach(item => {

        if(item){

            item.classList.remove(
                "blinkNow"
            );

        }

    });


    if(items[blinkIndex]){

        items[blinkIndex]
            .classList
            .add("blinkNow");

    }

}



/* =====================================================
   KLIK BARANG
===================================================== */

document
.querySelectorAll(".item")
.forEach(item => {

    item.addEventListener(
        "click",
        function(){

            /* Barang sudah selesai */

            if(
                item.classList.contains(
                    "kemas"
                )
            ){

                return;

            }


            /* Hanya objek blink */

            if(
                !item.classList.contains(
                    "blinkNow"
                )
            ){

                return;

            }


            activeItem = item;

            showQuestion();

        }
    );

});


/* =====================================================
   PAPAR SOALAN
===================================================== */

function showQuestion(){

    if(
        currentQuestion >=
        selected.length
    ){

        finishMission();

        return;

    }


    const q =
        selected[currentQuestion];


    document
        .getElementById(
            "questionText"
        )
        .textContent =
        q.q;


    let html = "";


    q.options.forEach(option => {

        html += `

            <button
                class="answer-btn"
                onclick="checkAnswer(this)"
            >
                ${option}
            </button>

        `;

    });


    document
        .getElementById("answers")
        .innerHTML =
        html;


    document
        .getElementById(
            "questionBox"
        )
        .style.display =
        "block";

}


/* =====================================================
   SEMAK JAWAPAN
   15 BETUL / MAKSIMUM 20 SOALAN
===================================================== */

function checkAnswer(button){

    const q =
        selected[currentQuestion];


    const answer =
        button.textContent.trim();


    /* Tutup soalan */

    document
        .getElementById(
            "questionBox"
        )
        .style.display =
        "none";


    /* Setiap jawapan = 1 soalan */

    currentQuestion++;


    /* =================================================
       JAWAPAN BETUL
    ================================================= */

    if(answer === q.a){

        score++;


        document
            .getElementById("score")
            .textContent =
            score;


        /* =================================================
           BARANG BERJAYA DIBERSIHKAN
        ================================================= */

        if(activeItem){


            /* =============================================
               BANTAL → BAKUL SAMPAH
            ============================================= */

            if(
                activeItem.id ===
                "bantal"
            ){

                const bear =
                    activeItem;

                const bakul =
                    document.getElementById(
                        "bakulsampah"
                    );


                const bearRect =
                    bear.getBoundingClientRect();


                const bakulRect =
                    bakul.getBoundingClientRect();


                const bearCenterX =
                    bearRect.left +
                    bearRect.width / 2;


                const bearCenterY =
                    bearRect.top +
                    bearRect.height / 2;


                const bakulCenterX =
                    bakulRect.left +
                    bakulRect.width / 2;


                const bakulCenterY =
                    bakulRect.top +
                    bakulRect.height / 2;


                const moveX =
                    bakulCenterX -
                    bearCenterX;


                const moveY =
                    bakulCenterY -
                    bearCenterY;


                bear.style.setProperty(
                    "--moveX",
                    moveX + "px"
                );


                bear.style.setProperty(
                    "--moveY",
                    moveY + "px"
                );


                bear.classList.remove(
                    "blinkNow"
                );


                bear.classList.add(
                    "buangSampah"
                );


                bear.style.pointerEvents =
                    "none";


                setTimeout(
                    function(){

                        bear.style.display =
                            "none";

                    },
                    1500
                );

            }


            /* =============================================
               BAKUL SAMPAH
            ============================================= */

            if(
                activeItem.id ===
                "bakulsampah"
            ){

                const img =
                    activeItem.querySelector(
                        "img"
                    );


                img.src =
                    "../images/bakulsampah2.png";


                activeItem.classList.add(
                    "kemas"
                );


                activeItem.style.pointerEvents =
                    "none";

            }


            /* =============================================
               YOYO → KOTAK
            ============================================= */

            if(
                activeItem.id ===
                "yoyo"
            ){

                activeItem.classList.remove(
                    "blinkNow"
                );


                activeItem.classList.add(
                    "terbang"
                );


                activeItem.style.pointerEvents =
                    "none";

            }


            /* =============================================
               BAKUL SAMPAH
            ============================================= */

            else if(
                activeItem.id ===
                "bakulsampah"
            ){

                const img =
                    activeItem.querySelector(
                        "img"
                    );


                img.src =
                    "../images/bakulsampah2.png";


                activeItem.classList.add(
                    "kemas"
                );


                activeItem.style.pointerEvents =
                    "none";

            }


            /* =============================================
               BARANG LAIN
            ============================================= */

            else{

                activeItem.classList.add(
                    "kemas"
                );


                activeItem.style.pointerEvents =
                    "none";

            }


            /* Hentikan blink */

            activeItem.classList.remove(
                "blinkNow"
            );


            /* =============================================
               BARANG SETERUSNYA
            ============================================= */

            blinkIndex++;


            if(
                blinkIndex <
                items.length
            ){

                items[blinkIndex]
                    .classList
                    .add("blinkNow");

            }

        }


        /* =================================================
           15 BETUL = TERUS MENANG
        ================================================= */

        if(score >= 15){

            setTimeout(
                function(){

                    finishMission();

                },
                500
            );

            return;

        }

    }


    /* =================================================
       JAWAPAN SALAH
    ================================================= */
else{

    const questionBox =
        document.getElementById("questionBox");

    const questionTitle =
        questionBox.querySelector("h2");

    const questionText =
        document.getElementById("questionText");

    const answers =
        document.getElementById("answers");


    // Sembunyikan tajuk CABARAN NOMBOR
    questionTitle.style.display = "none";


    // Papar hanya OPSS SALAH
    questionText.innerHTML =
        "⚠️ OPSS! SALAH!";

    questionText.style.color = "#f44336";
    questionText.style.fontSize = "32px";


    // Kosongkan jawapan
    answers.innerHTML = "";


    // Paparkan kotak
    questionBox.style.display = "block";


    // Barang yang sama kekal berkelip
    if(activeItem){

        activeItem.classList.add("blinkNow");

    }


    // Selepas 1 saat
    setTimeout(function(){

        questionBox.style.display = "none";

        // Kembalikan tajuk
        questionTitle.style.display = "block";

        // Kembalikan format asal
        questionText.style.color = "#333";
        questionText.style.fontSize = "21px";

        // Papar semula soalan
        showQuestion();

    }, 1000);

}


    /* =================================================
       MAKSIMUM 20 SOALAN
    ================================================= */

    if(currentQuestion >= 20){

        setTimeout(
            function(){

                finishMission();

            },
            500
        );

    }

}


/* =====================================================
   TAMAT MISI
===================================================== */

function finishMission(){


    /* =================================================
       BERJAYA
       WAJIB 15 BETUL
    ================================================= */

    if(score >= 15){


        /* =============================================
           SIMPAN STATUS MISI
        ============================================= */

        localStorage.setItem(
            "kunciNombor",
            "true"
        );


        localStorage.setItem(
            "misiNomborSelesai",
            "true"
        );


        localStorage.setItem(
            "misiTambahAktif",
            "true"
        );


        /* =============================================
           TAMBAH 1 KUNCI
        ============================================= */

        if(
            !localStorage.getItem(
                "kunciNomborDiberi"
            )
        ){

            let keys =
                parseInt(
                    localStorage.getItem(
                        "keys"
                    ) || "0",
                    10
                );


            localStorage.setItem(
                "keys",
                keys + 1
            );


            localStorage.setItem(
                "kunciNomborDiberi",
                "true"
            );

        }


        /* =============================================
           MESSAGE BERJAYA
        ============================================= */

        showSuccessBox();

    }


    /* =================================================
       GAGAL
    ================================================= */

    else{

        showFailBox();

    }

}
